# Vela-Client sample configuration
# Copy to /etc/vela/client.conf and edit before starting the daemon.
# All fields shown with their default values unless marked REQUIRED.

# ---------------------------------------------------------------------------
# gRPC server (outbound — connects to Vela-Server)
# ---------------------------------------------------------------------------

server_address = "192.168.1.100"   # REQUIRED — IP or hostname of Vela-Server
server_port    = 50051

# ---------------------------------------------------------------------------
# HalService listener (inbound — PySDK connects to this Client port)
# No DB writes occur on this path (invariant 0.3 of the remediation plan).
# ---------------------------------------------------------------------------

# hal_service_bind = "0.0.0.0"  # bind address; "127.0.0.1" to restrict to loopback
# hal_service_port = 50052       # default 50052; must be reachable by PySDK

# ---------------------------------------------------------------------------
# Spool (durability store)
# ---------------------------------------------------------------------------

spool_path             = "/var/lib/vela/spool/spool.db"
result_spool_cap_bytes = 2147483648   # 2 GiB
log_spool_cap_bytes    = 524288000    # 500 MiB

# ---------------------------------------------------------------------------
# TLS (leave empty for plaintext — lab-subnet default in v1)
# ---------------------------------------------------------------------------

# tls_ca   = "/etc/vela/ca.crt"
# tls_cert = "/etc/vela/client.crt"
# tls_key  = "/etc/vela/client.key"

# ---------------------------------------------------------------------------
# Extra log paths to tail and forward to the server
# ---------------------------------------------------------------------------

# log_paths = [
#   "/var/log/vela/hal.log",
# ]
